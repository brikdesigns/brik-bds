name: Build Design Tokens

on:
  # Path-filtered, no schedule (#2694). build:all-tokens is
  # build:sd-figma && build:sd-dark && build:modes — it rebuilds Style Dictionary
  # output purely from committed sources (the live Figma sync is a separate manual
  # script, scripts/sync-figma-mcp.js). Every real change lands via the push paths
  # below, so a scheduled rebuild only ever no-ops. workflow_dispatch stays for an
  # ad-hoc forced rebuild.
  push:
    paths:
      - 'design-tokens/**'
      - 'sd.config.tokens-studio.mjs'
  workflow_dispatch:

concurrency:
  group: build-tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build all tokens (Style Dictionary from Figma)
      run: npm run build:all-tokens

    - name: Stage token outputs
      run: |
        git add design-tokens/ tokens/
        git add -f build/

    - name: Commit and push changes
      run: |
        if git diff --cached --quiet; then
          echo "No token changes to commit"
          exit 0
        fi
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "Build design tokens — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push
