name: Chromatic

# PUBLISH-ONLY — this workflow hosts Storybook. It is NOT a visual-regression gate.
# ------------------------------------------------------------------------------
# ADR-026 (#1616) split Chromatic's two roles. Visual regression moved to the
# self-hosted Vitest `toMatchScreenshot` gate in test.yml (#1637), which is free on
# public-repo runners and blocking for real. What stays here is the half that has
# no free replacement: publishing the Storybook that backs the `main--` alias, i.e.
# the `/mcp`, `/index.json` and `/manifests/*` endpoints consumer-repo agents read.
#
# Why the visual gate had to move: the free plan's 5,000 billed snapshots/month was
# exhausted on every build sampled from 981 (2026-07-26) to 1024 (2026-08-01),
# including all three `visual-review`-labelled PR builds. A quota-limited build
# still exits 0, so the "blocking" label gate passed while capturing nothing.
#
# A quota-limited build DOES still publish ("✔ Storybook published" on build 1020),
# so hosting survives an empty quota — which is what makes publish-only viable at $0.
#
# There is no zero-cost publish mode: `chromatic --skip` does not upload at all
# ("Skipped build for commit … due to --skip", CLI v15.3.0, verified 2026-08-02),
# which refutes the leading candidate in #1498. Publishing costs whatever a
# TurboSnap-scoped build costs, so the cadence stays daily rather than per-merge.

on:
  # KEPT DAILY (not trimmed by #2694): this is a freshness gate, not idle burn.
  # brik-bds is a public repo so Actions minutes are free, and TurboSnap
  # (onlyChanged) captures ~0 snapshots on a no-change day — so a daily no-op
  # costs ~$0. Daily publish on main is the MCP-freshness cadence: `main--` can
  # lag main by up to 24h (#1498 tracks whether that lag is acceptable).
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily

  # Manual refresh — use after a merge that consumer agents need to see immediately.
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@07791f8243f4cb2698bf4d00426baf4b2d1cb7e0  # v13.3.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Always exit as soon as the Storybook is uploaded. Publishing is the
          # whole point of this job — snapshot results are not a gate here, and
          # waiting on them would make an unrelated visual diff fail a publish.
          exitOnceUploaded: true
          # TurboSnap keeps a publish from re-capturing all ~403 stories. It stays
          # on purely as cost control; nothing downstream reads the diff.
          onlyChanged: true

      # Post build result + snapshot usage to Slack. No-ops until the
      # SLACK_CHROMATIC_WEBHOOK_URL secret is set, so it's safe to merge first.
      # continue-on-error: a Slack outage must never fail the Chromatic job.
      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CHROMATIC_WEBHOOK_URL }}
          CODE: ${{ steps.chromatic.outputs.code }}
          CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          # TurboSnap-inherited snapshots. Not free — they bill at 0.2 each.
          INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          SPECS: ${{ steps.chromatic.outputs.specCount }}
          COMPONENTS: ${{ steps.chromatic.outputs.componentCount }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          COMMIT_SHA: ${{ github.sha }}
          # Publish-only, so every run is a branch publish (scheduled or dispatched).
          BUILD_CONTEXT: "`${{ github.ref_name }}`"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${CODE:-1}" = "0" ]; then
            status_emoji="✅"; status_text="passed"
          else
            status_emoji="❌"; status_text="failed"
          fi

          # Informational only. Chromatic snapshots are not a gate since ADR-026 —
          # pixel drift is caught by the Vitest visual gate in test.yml (#1637).
          changes="${CHANGES:-0}"
          if [ "${changes}" != "0" ]; then
            change_line="🔍 *${changes}* Chromatic visual change(s) — FYI, not a gate (ADR-026)"
          else
            change_line="No Chromatic visual changes"
          fi

          captured="${CAPTURED:-0}"
          inherited="${INHERITED:-0}"
          specs="${SPECS:-0}"
          usage_line="📸 Snapshots this build: *${captured}* captured + *${inherited}* inherited (${COMPONENTS:-?} components / ${specs} stories)"

          # Billed cost = captured x 1 + inherited x 0.2. Surfacing it per build
          # is the only running meter we have against the 5,000/mo free allotment
          # without opening the Chromatic billing page. Counts are in snapshots,
          # not stories — a story spans several snapshots (viewport/theme), so
          # never substitute specCount here. #771.
          if [ -n "${captured}${inherited}" ] && [ "$((captured + inherited))" -gt 0 ] 2>/dev/null; then
            billed=$(awk -v c="${captured}" -v i="${inherited}" 'BEGIN{printf "%.0f", c + i * 0.2}')
            usage_line="${usage_line}
          💳 Approx. billed: *${billed}* of 5,000/mo"
          fi

          # Heuristic: stories exist but nothing was captured on a passing build
          # → likely snapshot quota exhausted (or a no-op / TurboSnap build).
          quota_note=""
          if [ "${captured}" = "0" ] && [ "${specs}" != "0" ] && [ "${CODE:-1}" = "0" ]; then
            quota_note=$'\n⚠️ 0 snapshots captured with stories present — possible snapshot quota exhaustion. Check Chromatic billing/usage.'
          fi

          # Link line — omit any URL the action didn't emit.
          links="<${RUN_URL}|CI run>"
          [ -n "${STORYBOOK_URL:-}" ] && links="<${STORYBOOK_URL}|Storybook> · ${links}"
          [ -n "${BUILD_URL:-}" ] && links="<${BUILD_URL}|Build> · ${links}"

          short_sha="${COMMIT_SHA:0:7}"
          text="${status_emoji} *Chromatic build ${status_text}* on ${BUILD_CONTEXT} (\`${short_sha}\`)
          ${change_line}
          ${usage_line}${quota_note}
          ${links}"

          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
