name: Chromatic

# Snapshot budget model (#771)
# ---------------------------
# Chromatic bills a *captured* snapshot at 1 and a TurboSnap-skipped ("turbosnap")
# story at 0.2. With 403 stories that puts a ~80-billed floor on EVERY build, even
# one that captures nothing. The free plan allows 5,000 billed/month.
#
#   push-per-merge (old):  ~283 builds/mo x ~80  = ~22,600 billed  -> 4.5x over
#   daily schedule (new):   ~30 builds/mo x ~80  =  ~2,400 billed  -> fits
#
# That is why this workflow no longer runs on every push to main. The remaining
# headroom (~2,600 billed) covers opt-in PR gates and occasional full re-captures.

on:
  # Batched daily build on main. Replaces the per-push trigger — see the budget
  # model above. TurboSnap still scopes captures to what changed since the last
  # build, so a quiet day costs the floor and a busy day costs a little more.
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily

  # Opt-in blocking gate. Add the `visual-review` label to a PR and this runs
  # WITHOUT exitOnceUploaded, so unreviewed visual changes fail the check and
  # block merge. Opt-in rather than always-on because 49% of merges touch
  # component/CSS paths (154 of 313 over 30 days) — an always-on PR gate would
  # bill ~12,300/month, 2.5x the entire free allotment.
  pull_request:
    types: [labeled, synchronize, reopened]

  workflow_dispatch:
    inputs:
      full_capture:
        description: 'Re-capture every story (TurboSnap off) to refresh baselines — bills ~403, about 8% of the monthly allotment (#771). Leave off for a normal build.'
        type: boolean
        default: false

concurrency:
  # Full captures get their own group so the daily scheduled build or a
  # labelled-PR run can't cancel an in-flight ~403-billed run halfway
  # through (#1472). The per-push trigger this originally guarded against
  # was removed in #771.
  group: chromatic-${{ github.ref }}-${{ inputs.full_capture == true && 'full' || 'turbo' }}
  cancel-in-progress: true

jobs:
  chromatic:
    # PR runs only when the author/reviewer opted in with the `visual-review`
    # label. The three-way condition avoids re-billing a build every time an
    # unrelated label is added to an already-labelled PR.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'visual-review') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'visual-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@07791f8243f4cb2698bf4d00426baf4b2d1cb7e0  # v13.3.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Blocking on PRs (wait for results, non-zero exit on unreviewed
          # changes); advisory on the scheduled main build, where the merge has
          # already happened and blocking buys nothing.
          exitOnceUploaded: ${{ github.event_name != 'pull_request' }}
          # TurboSnap: snapshot only stories affected by the diff instead of all
          # ~403 every build. Global CSS (tokens/themes) imports into preview.tsx,
          # so a token edit still traces to every story → full re-snapshot. #771.
          #
          # Off when dispatched with full_capture — TurboSnap skips leave baselines
          # inherited from well before current main, which makes any later full
          # build unreadable (399/399 flagged on build 989). This is the escape
          # hatch that re-captures the floor. #1472
          onlyChanged: ${{ inputs.full_capture != true }}
          # autoAcceptChanges is deliberately NOT set (defaults off) — the changed-story
          # list on a full capture must be triaged by a human into real drift vs noise
          # before baselines move. Don't set it to `false` either: the action forwards
          # this input to `--auto-accept-changes`, which takes an optional branch glob,
          # so a literal "false" is ambiguous rather than a disable.

      # Post build result + snapshot usage to Slack. No-ops until the
      # SLACK_CHROMATIC_WEBHOOK_URL secret is set, so it's safe to merge first.
      # continue-on-error: a Slack outage must never fail the Chromatic job.
      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CHROMATIC_WEBHOOK_URL }}
          CODE: ${{ steps.chromatic.outputs.code }}
          CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          # TurboSnap-inherited snapshots. Not free — they bill at 0.2 each.
          INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          SPECS: ${{ steps.chromatic.outputs.specCount }}
          COMPONENTS: ${{ steps.chromatic.outputs.componentCount }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          COMMIT_SHA: ${{ github.sha }}
          # Which build this was — the workflow no longer runs only on main.
          # Quoted: the ' #' inside the format string would otherwise start a
          # YAML comment and silently truncate the expression.
          BUILD_CONTEXT: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('`{0}`', github.ref_name) }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${CODE:-1}" = "0" ]; then
            status_emoji="✅"; status_text="passed"
          else
            status_emoji="❌"; status_text="failed"
          fi

          changes="${CHANGES:-0}"
          if [ "${changes}" != "0" ]; then
            change_line="🔍 *${changes}* visual change(s) need review"
          else
            change_line="No visual changes"
          fi

          captured="${CAPTURED:-0}"
          inherited="${INHERITED:-0}"
          specs="${SPECS:-0}"
          usage_line="📸 Snapshots this build: *${captured}* captured + *${inherited}* inherited (${COMPONENTS:-?} components / ${specs} stories)"

          # Billed cost = captured x 1 + inherited x 0.2. Surfacing it per build
          # is the only running meter we have against the 5,000/mo free allotment
          # without opening the Chromatic billing page. Counts are in snapshots,
          # not stories — a story spans several snapshots (viewport/theme), so
          # never substitute specCount here. #771.
          if [ -n "${captured}${inherited}" ] && [ "$((captured + inherited))" -gt 0 ] 2>/dev/null; then
            billed=$(awk -v c="${captured}" -v i="${inherited}" 'BEGIN{printf "%.0f", c + i * 0.2}')
            usage_line="${usage_line}
          💳 Approx. billed: *${billed}* of 5,000/mo"
          fi

          # Heuristic: stories exist but nothing was captured on a passing build
          # → likely snapshot quota exhausted (or a no-op / TurboSnap build).
          quota_note=""
          if [ "${captured}" = "0" ] && [ "${specs}" != "0" ] && [ "${CODE:-1}" = "0" ]; then
            quota_note=$'\n⚠️ 0 snapshots captured with stories present — possible snapshot quota exhaustion. Check Chromatic billing/usage.'
          fi

          # Link line — omit any URL the action didn't emit.
          links="<${RUN_URL}|CI run>"
          [ -n "${STORYBOOK_URL:-}" ] && links="<${STORYBOOK_URL}|Storybook> · ${links}"
          [ -n "${BUILD_URL:-}" ] && links="<${BUILD_URL}|Build> · ${links}"

          short_sha="${COMMIT_SHA:0:7}"
          text="${status_emoji} *Chromatic build ${status_text}* on ${BUILD_CONTEXT} (\`${short_sha}\`)
          ${change_line}
          ${usage_line}${quota_note}
          ${links}"

          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
