name: MDX Token Check

# Runs scripts/lint-mdx-tokens.mjs on every PR (and push to main) that touches
# the MDX corpus, the token registry sources, or the checker itself. Validates
# that every Semantic-tier token NAME appearing in a docs code block or table
# resolves to a real token in dist/tokens.css (or a component-scoped CSS knob).
#
# Why this is a CI gate (not just pre-push):
#   - Pre-push runs `validate:full` (scripts/validate-all.js → "MDX Tokens")
#     locally, but that never runs in CI.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks.
#   - Fork / fresh-clone PRs may not have husky installed.
# Before this workflow, a phantom token documented as real (the #512 / #553
# failure class — e.g. `--text-info` for `--text-status-info`) could land on
# main green, silently misleading every consumer who copied it.
#
# The registry (dist/tokens.css) is a git-ignored build artifact, so the job
# builds it first — a pure, network-free concat of the committed tokens/*.css.
# Path-filtered: most PRs don't touch the corpus or tokens and skip the job.
#
# Issue: brikdesigns/brik-bds#1362

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs-site/content/docs/**'
      - 'components/ui/**'
      - 'tokens/**'
      - 'build/figma/css/**'
      - 'scripts/lint-mdx-tokens.mjs'
      - 'scripts/build-dist-tokens.js'
      - 'package.json'
      - '.github/workflows/mdx-token-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs-site/content/docs/**'
      - 'components/ui/**'
      - 'tokens/**'
      - 'build/figma/css/**'
      - 'scripts/lint-mdx-tokens.mjs'
      - 'scripts/build-dist-tokens.js'
      - 'package.json'
      - '.github/workflows/mdx-token-check.yml'

concurrency:
  group: mdx-token-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mdx-token-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # dist/tokens.css is git-ignored; build it from the committed tokens/*.css
      # so the checker reads the canonical registry. (The checker self-builds it
      # too, but doing it explicitly keeps the failure mode obvious in CI logs.)
      - name: Build token registry
        run: npm run build:dist-tokens

      - name: Check MDX token names
        run: node scripts/lint-mdx-tokens.mjs
