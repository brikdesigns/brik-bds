name: new-task Flag Order Check

# Locks which ticket new-task.sh's overlap + claim gates end up pointed at.
#
# The parse loop used to `break` at the first positional argument, so a flag
# written after the slug was discarded silently. With --issue gone, the gate
# falls through to derive_issue_from_slug, which matches any trailing 2-5 digit
# run in the slug — so `new-task.sh tokens-ramp-1437 --issue 1512` gated on 1437
# and check_issue_claim then CLAIMED 1437 for the branch (#1619). A skipped gate
# is bad; a gate on the wrong ticket is worse, because it reports clean.
#
# The suite's load-bearing assertion is that the DERIVED path does NOT fire when
# an explicit --issue is supplied. "Some gate ran" would have passed pre-fix. Its
# negative control rebuilds the `break` loop in-process and requires the trailing
# case to gate on 1437.
#
# This file is a deliberate TWIN of brik-llm's new-task-flag-order-contract.yml
# and the equivalent step inside brik-client-portal's ci.yml — separate repos,
# same script, same bug (brikdesigns/brik-llm#1820,
# brikdesigns/brik-client-portal#2624).
#
# Cheap and hermetic: bash only, no npm ci, no build, no network.

on:
  pull_request:
    paths:
      - 'scripts/new-task.sh'
      - 'scripts/lib/overlap-filters.sh'
      - 'scripts/__tests__/test-new-task-flag-order.sh'
      - '.github/workflows/new-task-flag-order-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/new-task.sh'
      - 'scripts/lib/overlap-filters.sh'
      - 'scripts/__tests__/test-new-task-flag-order.sh'
      - '.github/workflows/new-task-flag-order-check.yml'
  workflow_dispatch:

concurrency:
  group: new-task-flag-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  new-task-flag-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flags are honoured on either side of the slug
        run: bash scripts/__tests__/test-new-task-flag-order.sh < /dev/null

      # --severity=warning: new-task.sh predates this gate and carries SC1091
      # (unfollowed `source`, unavoidable here) plus style notes. Gating on
      # warning-and-above keeps real findings failing without demanding an
      # unrelated cleanup of the whole script in this PR.
      - name: shellcheck new-task.sh + its test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
                     scripts/new-task.sh \
                     scripts/__tests__/test-new-task-flag-order.sh
