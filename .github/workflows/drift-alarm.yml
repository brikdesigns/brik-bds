name: Consumer Drift Alarm

# Phase 1: informational only — this workflow never fails, even when consumers
# are significantly behind. The output surfaces in the job summary so Nick can
# spot drift during his release flow. See scripts/check-drift.mjs for details.
#
# Triggers:
#   - After every BDS release (tag push matching bds-*)
#   - Weekly schedule (catches drift accumulating between releases)
#   - Manual via workflow_dispatch

on:
  push:
    tags:
      - 'bds-*'
  schedule:
    - cron: '0 13 * * 1'  # Monday 09:00 ET (13:00 UTC)
  workflow_dispatch:

concurrency:
  group: drift-alarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Check consumer drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout brik-bds
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history — needed to count commits from older submodule SHAs

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Cross-repo read via the brik-ci-bot App (App 3951278), not a PAT. The
      # App is installed org-wide (repository_selection=all), so its installation
      # token can read every consumer repo, minted fresh each run — nothing to
      # expire. Retires CONSUMER_DRIFT_TOKEN, whose silent expiry made this alarm
      # fall back to github.token (which can't cross repos) and report every
      # consumer 401/unreachable while still passing green (#2421). Same pattern
      # as tokens-gate.yml's deleted-token sweep (#2419).
      - name: Mint brik-ci-bot token (cross-repo read)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BRIK_CI_BOT_APP_ID }}
          private-key: ${{ secrets.BRIK_CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check consumer drift
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/check-drift.mjs
