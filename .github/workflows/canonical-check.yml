name: Canonical Token Check

# Enforces BDS's canonical token registry on every PR and on every push to
# main. Fails the build if any source file references a `--text-*`,
# `--surface-*`, `--background-*`, semantic `--border-*`, or `--color-*`
# name that isn't defined in `dist/tokens.css`.
#
# Why this is a CI gate (not just pre-push):
#   - Pre-push runs `validate:full` locally but does NOT include
#     `canonical-check` — see package.json scripts.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks
#     entirely.
#   - PRs from forks or fresh clones may not have husky installed.
# This workflow is the cross-machine guarantee that no drift lands on main.
#
# Source of truth: https://design.brikdesigns.com/docs/primitives/color
# Issue: brikdesigns/brik-bds#300

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# `canonical-check` is a REQUIRED context on `main`, so this block may not cancel.
# A cancelled check-run is not an absent one — protection can keep reporting the
# context as `expected`, and a green re-run does not clear it; only a new head SHA
# does (brik-llm#2094). `queue: max` covers the pending run the flag does not: the
# default `queue: single` lets a newer run evict the waiter, leaving a check-suite
# with zero check-runs and the same stuck `expected` (brik-llm#2176).
#
# `queue: max` and `cancel-in-progress: true` together are a workflow validation
# error, so the two lines change as a pair.
concurrency:
  group: canonical-check-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  canonical-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif → code-scanning annotations
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # canonical-check parses the allowlist from `dist/tokens.css`, which is
      # gitignored. `build:dist-tokens` is the cheap path — concatenates the
      # already-built figma-tokens.css + dark + corrections + brand + gap-fills.
      # Avoids the full `build:lib` (Vite + tsc) which would add ~30s for no
      # extra coverage.
      - name: Build dist tokens (canonical allowlist source)
        run: npm run build:dist-tokens

      - name: Canonical token check
        run: npm run canonical-check -- --report canonical-check.sarif

      # Surface violations as code-scanning annotations anchored to file+line.
      # Runs even when the check above failed — that's exactly when there are
      # annotations to show. Non-blocking: the check step is the gate, so a
      # failed upload (e.g. fork PRs lacking security-events write) must never
      # flip an otherwise-green run red.
      - name: Upload SARIF report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: canonical-check.sarif
          category: canonical-check
