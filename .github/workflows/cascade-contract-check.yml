name: Cascade Contract Check

# Runs the published `cascade-contract-check` engine against this repo's OWN
# consumer surface: docs-site/app/global.css.
#
# docs-site consumes @brikdesigns/bds through the same two package entry points
# every other consumer uses, so it is a consumer and the adoption contract
# applies to it. It was importing both files UNLAYERED while the page it serves
# (getting-started/cascade) documents the layer() requirement — brik-bds#1437.
#
# The engine itself is unit-tested in scripts/__tests__ (the `test` job). This
# gate is the other half: it points the engine at the real file, so the docs
# site can't drift back off the contract it publishes.
#
# Cheap by design: a plain Node script over one source file — no `npm ci`, no
# build. The script has no runtime dependencies.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# `cascade-contract-check` is a REQUIRED context on `main` since #2038, so this block may not
# cancel. A cancelled check-run is not an absent one — protection goes on
# reporting the context as `expected`, and a green re-run does not clear it;
# only a new head SHA does (brik-llm#2094). `cancel-in-progress: false` alone
# does NOT cover the PENDING run, which the default `queue: single` still
# evicts (brik-llm#2176). The two lines are one change, and `queue: max` with
# `cancel-in-progress: true` is a workflow validation error.
concurrency:
  group: cascade-contract-check-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  cascade-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check docs-site honors the cascade adoption contract
        run: npm run cascade-contract-check
