name: Update Visual Baselines

# Regenerates the visual-regression baselines (tests/visual/__screenshots__/)
# and commits them to the branch the workflow is dispatched on.
#
# This is the ONLY sanctioned way to produce baselines (ADR-026): they must
# come from the same pinned container image the `visual` gate in test.yml
# runs in. A baseline committed from a dev machine is platform-suffixed
# (darwin/win32) or pixel-shifted and guarantees a false positive.
#
# `vitest --update` rewrites a reference ONLY when the comparator fails against
# the committed one (@vitest/browser determineOutcome: a present reference that
# compares clean returns `matched-after-comparison` and writes nothing). So
# leaving the tree in place makes the commit contain exactly the baselines that
# really changed — which is what makes the git diff usable as the review surface
# (ADR-026: there is no hosted approve-UI).
#
# This job used to `rm -rf` the tree first, which made every reference "missing"
# and therefore written fresh with no comparison at all. Chromium antialiasing
# is not byte-reproducible between container runs, so that rewrote baselines the
# comparator scores as identical: 9 of the 10 files in one measured commit had
# ZERO mismatched pixels under the gate's own comparator (#1673).
#
# Pruning is now opt-in via the `prune` input, because it is the only thing the
# wipe was for. Run with prune=true after deleting or renaming stories; expect
# that run to touch many files, and review it as the churn-heavy run it is.
#
# The commit is pushed with a brik-ci-bot App installation token rather than the
# default GITHUB_TOKEN, because GitHub refuses to let a GITHUB_TOKEN-authored
# push trigger CI — that left every check on the PR parked at `action_required`
# and showing no results at all (#1662). Nothing needs approving or reopening now.
#
# Usage: Actions → Update Visual Baselines → Run workflow → pick the branch.

on:
  workflow_dispatch:
    inputs:
      prune:
        description: 'Wipe baselines first, pruning references for deleted/renamed stories. Rewrites every file — only needed after a story is removed or renamed.'
        type: boolean
        default: false
      threshold:
        description: 'Comparator threshold for this dispatch. Leave blank for the shipped 0.1. Lower it (e.g. 0.05) when the change is below what the gate can see — otherwise the regen writes nothing (#1732).'
        type: string
        default: ''
      floor:
        description: 'allowedMismatchedPixels for this dispatch. Leave blank for the shipped 10. Set 0 when the change is smaller than the noise margin (#1732).'
        type: string
        default: ''

# The baseline commit is pushed with a brik-ci-bot App installation token, NOT
# the default GITHUB_TOKEN — see the mint step below for why. GITHUB_TOKEN itself
# needs nothing beyond read here.
permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    # Keep in lockstep with the `visual` job in test.yml and the `playwright`
    # npm dependency — baselines are only valid inside this exact image.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Same reason as the `visual` job (#1778). Without --ipc=host Chromium is
      # capped at Docker's 64 MB default /dev/shm and dies mid-run: this workflow
      # lost 121 of 146 suites to `NetworkError` on run 31613614226 and therefore
      # regenerated nothing. The gate being broken is bad; the tool that fixes
      # the gate's baselines being broken the same way is what made #1785
      # unfixable. Playwright: "Using --ipc=host is recommended when using
      # Chromium. Without it, Chromium can run out of memory and crash."
      # https://playwright.dev/docs/docker
      options: --ipc=host
    steps:
      # WHY an App token instead of the default GITHUB_TOKEN (#1662):
      # GitHub will not let a GITHUB_TOKEN-authored push trigger CI — "events
      # triggered by the GITHUB_TOKEN will not create a new workflow run", and
      # for `pull_request` the runs are created in an approval-required state
      # instead. So the baseline commit left every check on the PR parked at
      # `action_required` and the PR showed NO gate results, which reads as "not
      # run yet" rather than "waiting on you". That cost 40 minutes on #1659 and
      # two close/reopen cycles on #1683.
      #
      # GitHub names an App installation token (or a PAT) as the escape; we use
      # the pre-existing brik-ci-bot App, which is already installed org-wide
      # with contents:write, so nothing had to be minted. Registered in
      # brik-llm secrets.yaml as `github-app-fleet-automation` — rotating the
      # App key now requires `brik-secrets propagate` to reach these secrets.
      #
      # Least privilege: the App holds more than this, but permission-contents
      # scopes the MINTED token to contents:write alone, so a leak of this
      # token cannot touch issues, PRs, or workflows.
      # Docs: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      - name: Mint push token (brik-ci-bot App)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BRIK_CI_BOT_APP_ID }}
          private-key: ${{ secrets.BRIK_CI_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Persisted for the `git push` below — this is what makes the commit
          # App-authored and therefore CI-triggering.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prune baselines before regenerating
        if: ${{ inputs.prune }}
        run: rm -rf tests/visual/__screenshots__

      # `--update` rewrites a reference only when the comparator FAILS it, so
      # the regen is exactly as sensitive as the gate — and a change below the
      # gate's bar cannot be recorded at all. Two references rotted for three
      # months that way (#1732: Pagination 1043 px and Stepper 7 px, both from
      # #1695's disabled-fade change, both scored as passing at the then
      # shipped threshold 0.2). Lowering threshold / floor for one dispatch is
      # the only way out; blank leaves the shipped values untouched.
      # --maxWorkers=1 for the same reason as the gate (#1778): concurrent
      # screenshot captures lose pages, and a lost page silently regenerates
      # NOTHING for its stories — the job would push a partial update that looks
      # complete. Determinism matters more than wall clock here.
      #
      # `|| true` then a retry of only the dropped files: `--update` exits
      # non-zero for every reference it rewrites, so its exit code cannot
      # distinguish "wrote a baseline" from "page died". The classifier can, and
      # a drop here means those stories were never even rendered.
      - name: Regenerate baselines
        env:
          VISUAL_THRESHOLD: ${{ inputs.threshold }}
          VISUAL_FLOOR_PIXELS: ${{ inputs.floor }}
          DROP_ATTEMPTS: '4'
        run: |
          VISUAL_GATE=1 npx vitest run --project storybook --update --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile=visual-report.json || true

          n=0
          while [ "$n" -lt "$DROP_ATTEMPTS" ]; do
            node scripts/classify-visual-failure.mjs visual-report.json --list-drops > dropped.txt
            COUNT=$(wc -l < dropped.txt | tr -d ' ')
            [ "$COUNT" -eq 0 ] && break
            n=$((n + 1))
            echo ""
            echo "↻ regen retry $n/$DROP_ATTEMPTS — $COUNT suite(s) never rendered:"
            sed 's/^/    /' dropped.txt
            echo ""
            VISUAL_GATE=1 npx vitest run --project storybook --update --maxWorkers=1 \
              $(tr '\n' ' ' < dropped.txt) \
              --reporter=default --reporter=json --outputFile=visual-report.json || true
          done

          # A suite that never rendered after every retry must NOT be committed as
          # a silent no-op — the operator would read the resulting commit as a
          # complete regeneration.
          LEFT=$(node scripts/classify-visual-failure.mjs visual-report.json --list-drops | wc -l | tr -d ' ')
          if [ "$LEFT" -ne 0 ]; then
            echo "✗ $LEFT suite(s) still never rendered — refusing to push a partial"
            echo "  regeneration. These stories would keep their stale baselines while"
            echo "  the commit message claimed otherwise. See #1778."
            node scripts/classify-visual-failure.mjs visual-report.json || true
            exit 1
          fi
          echo "✓ every suite rendered; baselines below are the real diff."

      - name: Commit and push baselines
        id: commit
        run: |
          # The container user differs from the checkout owner — git refuses
          # to operate on "dubiously owned" repos without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # brik-ci-bot[bot], matching the App whose token pushes this commit.
          # The numeric prefix is that bot account's user id (290376200) — the
          # noreply form GitHub requires to attribute the commit to the App.
          git config user.name "brik-ci-bot[bot]"
          git config user.email "290376200+brik-ci-bot[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            {
              echo "## No baseline change"
              echo
              echo 'Every reference compared clean against a fresh capture, so'
              echo '`vitest --update` wrote nothing and there is no commit. The'
              echo "PR's existing \`visual\` result already reflects this branch —"
              echo 'nothing to release.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Baselines changed:"
          git diff --cached --name-only
          git commit -m "chore(visual): regenerate baselines ($(git rev-parse --short HEAD))${{ inputs.prune && ' [pruned]' || '' }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # #1672's stopgap — printing the `gh api .../approve` loop — is gone: the
      # App-token push above triggers CI directly, so there is nothing held to
      # release. What the operator needs now is just the review pointer, because
      # ADR-026 makes the git diff the review surface (there is no hosted UI).
      - name: Summarise the pushed baselines
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "## Baselines pushed to \`${BRANCH}\`"
            echo
            echo 'Pushed as `brik-ci-bot[bot]` with an App installation token, so the'
            echo 'gates re-ran on the new commit automatically — no approval step, no'
            echo 'close/reopen. Watch the PR checks.'
            echo
            echo '### Review the diff — it IS the gate (ADR-026)'
            echo
            echo 'Only baselines the comparator actually failed were rewritten, so every'
            echo 'file below is a real pixel change. Confirm each one is intended:'
            echo
            echo '```'
            git diff --name-only 'HEAD^' HEAD -- tests/visual/__screenshots__
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
