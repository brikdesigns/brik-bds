name: stale-citation-sweep

# Anti-staleness gate, Backstop B to `merge-reconcile`. That gate catches issues
# a merged PR *referenced*; this one catches issue bodies whose *citations* have
# rotted — a path that was deleted or moved, or a token name that no longer
# exists in the registry.
#
# Why it matters: a builder picking up the issue is sent to a file that isn't
# there, so the stated scope is unworkable before any code gets written. On the
# 2026-07-28 backlog, 24 of 129 open issues cited at least one path absent from
# `git ls-files` (#1509).
#
# Two entry points, one checker:
#
#   1. At filing time — an issue opened or edited is scanned immediately, so a
#      dead citation is flagged within a minute of being written instead of
#      waiting up to seven days for the cron. #1383 sat misleading for four days
#      citing a component deleted 68 days earlier; anyone picking it up in that
#      window would have designed against an architecture that was gone (#1521).
#   2. Weekly sweep over every open issue — catches bodies that were accurate
#      when written and rotted afterwards, which the filing-time check cannot
#      see by definition.
#
# Anything with a dead citation gets the `needs:citation-fix` label plus ONE
# marker-guarded comment, rewritten in place on later runs rather than re-posted.
# Closing an issue clears the flag outright; editing one re-scans it, so the flag
# drops only when the citations actually resolve — not merely because someone
# touched the body. The weekly sweep clears it the same way for issues fixed
# without an edit event.
#
# Advisory only — it never hard-fails. Some citations are deliberate forward
# references to files the issue will create, so this reports, it does not block.
# Measured on the 2026-07-28 backlog: 32 of 129 issues hit, 24 on paths and 8 on
# tokens. The token hits skew toward proposals (#456 proposes a whole opacity
# taxonomy), which is why an issue can opt out with `<!-- citation-sweep:ignore -->`.
#
# The opt-out covers BOTH directions, because the detector parses prose and so
# cannot tell a citation from a subject — and should not try (#1929):
#   • forward — a token or file the issue will CREATE and that does not exist yet
#   • backward — a token or file the issue exists to REMOVE and that is already gone
# #1928 is the backward case: filed to delete three phantom token names from a
# docs page, it had to quote them to be actionable, and the sweep flagged the
# quote. Neither direction is a dead link a builder would follow, which is the
# only thing this gate is for.
#
# Exemptions: `meta:project` parents (umbrella bodies cite broadly and are read
# as roadmaps, not build instructions) and `icebox` (parked — nobody is
# following its links).
#
# NOTE — this deliberately DIVERGES from issue-size-gate and merge-reconcile,
# which also exempt sub-issues. Those two decide whether an issue should be
# closed or re-scoped, and a parent owns its children's lifecycle. Citation
# accuracy is not a lifecycle question: a sub-issue is precisely what a builder
# opens and works from, so a dead path there misleads more reliably, not less.
# Inheriting the sub-issue exemption suppressed 22 of 31 findings on the first
# run — see #1513 for the measurement behind this change.
#
# Rollout to other repos: copy this single file. Path checking derives its
# top-level directories from `git ls-files`, and token checking is skipped
# entirely when there is no token registry to check against.
#
# Issue: brikdesigns/brik-bds#1509

on:
  schedule:
    # Tuesdays 08:00 UTC — a day after merge-reconcile so the two sweeps don't
    # contend for the same API budget.
    - cron: '0 8 * * 2'
  issues:
    types: [opened, edited, closed]
  workflow_dispatch:

concurrency:
  group: stale-citation-sweep-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Only the token half needs a build; the path half runs off git alone.
      # Skipped on `issues: closed`, which drops the flag without scanning
      # anything — every other event checks tokens, so a filing-time scan is not
      # a weaker check than the weekly one. Costs ~25s of the ~40s a full sweep
      # takes, which still lands a filing-time flag inside a minute.
      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build token registry
        if: github.event.action != 'closed'
        # dist/tokens.css is git-ignored, so build it from the committed
        # tokens/*.css. Best-effort: if this fails the sweep still checks paths
        # rather than skipping entirely. Never fail an advisory job on a build.
        run: npm run build:dist-tokens || echo "token registry unavailable — path-only sweep"

      - name: Check citations (one issue on an issues event, all open issues otherwise)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const NEEDS = 'needs:citation-fix';
            const MARKER = '<!-- stale-citation-sweep -->';
            const TOKEN_REGISTRY = 'dist/tokens.css';
            const DOCS_ROOT = 'docs-site/content/docs';

            // Webhook payloads and the REST list both carry labels as objects;
            // tolerate plain strings so one helper serves every call site.
            const labelNames = i => (i.labels || []).map(l => (typeof l === 'string' ? l : l.name));

            // ── Single-issue path: opened / edited / closed ──
            // `closed` drops the flag and stops — a closed issue misleads nobody.
            // `opened` and `edited` fall through to the same checker the weekly
            // sweep runs, and the scan result decides the final label state: the
            // flag is added when citations are dead and cleared by the reconcile
            // pass at the bottom when they all resolve.
            //
            // Deciding from the scan rather than clearing up front is deliberate.
            // The previous version cleared on ANY edit and waited for Tuesday, so
            // an edit that did not actually repair the citation left the issue
            // unflagged for up to a week — the exposure window #1521 exists to
            // close. Clearing first and re-adding would also churn the timeline
            // with an unlabeled/labeled pair on every edit.
            const SINGLE = context.eventName === 'issues';
            const single = SINGLE ? context.payload.issue : null;

            if (SINGLE) {
              // `issues` does not fire for pull requests; belt and braces.
              if (single.pull_request) return;
              if (context.payload.action === 'closed') {
                if (labelNames(single).includes(NEEDS)) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: single.number, name: NEEDS,
                  }).catch(e => { if (e.status !== 404) throw e; });
                  core.info(`Cleared ${NEEDS} on #${single.number} (issue closed)`);
                }
                return;
              }
            }

            // ── Build the two authorities ──

            const tracked = new Set(
              execSync('git ls-files', { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 })
                .split('\n').filter(Boolean)
            );
            core.info(`Tracked files: ${tracked.size}`);

            // Top-level dirs come from the repo itself, so a cited path only
            // counts when it is plausibly repo-relative. This is also what
            // makes cross-repo citations (`brik-client-portal/src/...`) exempt
            // for free — that prefix is not a directory here.
            const topDirs = new Set(
              [...tracked].map(p => p.split('/')[0]).filter(p => p.includes('.') === false)
            );

            // Token names declared in the registry, plus the set of their first
            // segments. The prefix set is what separates a real token citation
            // (`--surface-primary`) from a CLI flag (`--json`, `--limit`):
            // no `json` prefix is declared, so the flag is never considered.
            const declaredTokens = new Set();
            const tokenPrefixes = new Set();
            let tokensAvailable = false;
            if (fs.existsSync(TOKEN_REGISTRY)) {
              const css = fs.readFileSync(TOKEN_REGISTRY, 'utf8');
              for (const m of css.matchAll(/^\s*(--[a-z0-9-]+)\s*:/gm)) {
                declaredTokens.add(m[1]);
                tokenPrefixes.add(m[1].slice(2).split('-')[0]);
              }
              tokensAvailable = declaredTokens.size > 0;

              // ∪ every custom property this repo's CSS knows about — the
              // CSS-Override-API knobs, which legitimately never enter the
              // registry. Two widenings over the obvious version, both learned
              // from real false positives:
              //
              //   1. ALL tracked .css, not just components/ui/. `--bds-hero-bg`
              //      lives in content-system/blueprints/react/Hero.css.
              //   2. `var(--name)` reads count, not only `--name:` writes. A
              //      consumer-supplied knob is only ever READ with a fallback —
              //      `var(--bds-hero-bg, var(--page-primary))` — so it is never
              //      declared anywhere and a declarations-only union misses it.
              for (const f of tracked) {
                if (!f.endsWith('.css')) continue;
                const src = fs.readFileSync(f, 'utf8');
                for (const m of src.matchAll(/^\s*(--[a-z0-9-]+)\s*:/gm)) declaredTokens.add(m[1]);
                for (const m of src.matchAll(/var\(\s*(--[a-z0-9-]+)/g)) declaredTokens.add(m[1]);
              }
            }
            core.info(tokensAvailable
              ? `Token registry: ${declaredTokens.size} tokens, ${tokenPrefixes.size} prefixes`
              : `Token registry absent — checking paths only`);

            // ── Citation extraction ──

            // Longest-first, then a trailing boundary. Regex alternation is
            // ORDERED, so `jsx?` before `json` makes `.json` match as `.js` and
            // leaves the `on` behind — every .json citation then reads as dead.
            // The boundary stops `.jsonl` / `.mdxx` matching a shorter prefix.
            const SRC_EXT = 'tsx|ts|jsx|js|mjs|cjs|css|mdx|md|json|yaml|yml|sh|py';
            const PATH_RE = new RegExp(
              String.raw`(?:^|[\s(\[\`'"])([A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)+\.(?:${SRC_EXT})(?![A-Za-z0-9]))`,
              'g'
            );
            // Two-or-more segments only. Single-segment flags (`--json`) can
            // never collide with a namespaced token.
            const TOKEN_RE = /--([a-z][a-z0-9]*)-([a-z0-9-]+)/g;

            // Escape hatch. Two legitimate cases produce citations that will
            // never resolve: an issue *proposing* new tokens or files, and an
            // issue whose subject IS dead citations (this gate's own tracking
            // issue quotes them as examples). Both opt out with one line.
            const OPT_OUT = '<!-- citation-sweep:ignore -->';

            function deadCitations(body) {
              const paths = new Set();
              const tokens = new Set();
              if (!body || body.includes(OPT_OUT)) return { paths, tokens };

              for (const m of body.matchAll(PATH_RE)) {
                // Strip a markdown line anchor: `Card.tsx#L197` → `Card.tsx`.
                const p = m[1].replace(/#L\d+(-L\d+)?$/, '');
                if (!topDirs.has(p.split('/')[0])) continue;   // not repo-relative
                if (tracked.has(p)) continue;
                // Docs pages are habitually cited by their route rather than
                // their path — `content-system/index.mdx` for the file at
                // `docs-site/content/docs/content-system/index.mdx`. Shorthand,
                // not rot, so resolve it before calling the citation dead.
                if (tracked.has(`${DOCS_ROOT}/${p}`)) continue;
                paths.add(p);
              }

              if (tokensAvailable) {
                for (const m of body.matchAll(TOKEN_RE)) {
                  const name = m[0];
                  if (!tokenPrefixes.has(m[1])) continue;       // not a token namespace
                  if (name.includes('{') || name.endsWith('-')) continue;  // placeholder
                  if (!declaredTokens.has(name)) tokens.add(name);
                }
              }
              return { paths, tokens };
            }

            // ── Label plumbing ──

            async function ensureLabel() {
              await github.rest.issues.getLabel({ owner, repo, name: NEEDS }).catch(async (e) => {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: NEEDS, color: 'd4a72c',
                  // GitHub caps label descriptions at 100 chars; a longer one
                  // 422s and kills the job (the #1507 failure).
                  description: 'Auto-applied by stale-citation-sweep: body cites a file or token that no longer exists',
                });
                core.info(`Created label ${NEEDS}`);
              });
            }

            // `meta:project` parents cite broadly and are read as roadmaps;
            // `icebox` is parked and nobody is following its links. Sub-issues
            // are NOT exempt — see the divergence note in the header.
            const EXEMPT_LABELS = ['meta:project', 'icebox'];
            const isExempt = labels => labels.some(l => EXEMPT_LABELS.includes(l));

            // Batched lookup for the weekly sweep, which only has issue numbers.
            // The single-issue path already has the labels in its payload and
            // calls isExempt() directly instead.
            async function exemptions(numbers) {
              const out = new Map();
              for (let s = 0; s < numbers.length; s += 25) {
                const chunk = numbers.slice(s, s + 25);
                const q = `query{repository(owner:"${owner}",name:"${repo}"){` +
                  chunk.map(n => `i${n}:issue(number:${n}){number labels(first:50){nodes{name}}}`).join(' ') +
                  `}}`;
                const res = await github.graphql(q);
                for (const n of chunk) {
                  const it = res.repository[`i${n}`];
                  if (!it) {
                    // Exempt on a lookup miss so a transient API hiccup can't
                    // spray labels — but say so, since a silent skip here
                    // looks identical to "nothing was wrong".
                    core.warning(`#${n}: issue lookup returned null — exempting this run`);
                    out.set(n, true);
                    continue;
                  }
                  out.set(n, isExempt(it.labels.nodes.map(x => x.name)));
                }
              }
              return out;
            }

            // ── Scan ──

            // The webhook payload already carries the body and the labels, so
            // the single-issue path spends ZERO extra API calls collecting them.
            // It is not a one-issue rerun of the 129-issue sweep.
            let issues;
            if (SINGLE) {
              issues = [single];
              core.info(`Scanning #${single.number} (issue ${context.payload.action})`);
            } else {
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 100,
              });
              issues = open.filter(i => !i.pull_request);
              core.info(`Scanning ${issues.length} open issues`);
            }

            const hits = [];
            for (const i of issues) {
              const { paths, tokens } = deadCitations(i.body);
              if (paths.size || tokens.size) hits.push({ n: i.number, paths, tokens, labels: labelNames(i) });
            }

            const exempt = SINGLE
              ? new Map([[single.number, isExempt(labelNames(single))]])
              : (hits.length ? await exemptions(hits.map(h => h.n)) : new Map());
            const flagged = hits.filter(h => !exempt.get(h.n));
            core.info(`Dead citations in ${hits.length} issues; ${flagged.length} after exemptions`);

            if (flagged.length) await ensureLabel();

            for (const h of flagged) {
              const lines = [
                `${MARKER}`,
                `**This issue cites files or tokens that no longer exist.** A builder following them would be sent nowhere.`,
                ``,
              ];
              if (h.paths.size) {
                lines.push(`Not in \`git ls-files\`:`, ``);
                for (const p of [...h.paths].sort()) lines.push(`- \`${p}\``);
                lines.push(``);
              }
              if (h.tokens.size) {
                lines.push(`Not in \`${TOKEN_REGISTRY}\`:`, ``);
                for (const t of [...h.tokens].sort()) lines.push(`- \`${t}\``);
                lines.push(``);
              }
              lines.push(
                `Update the body to point at what exists, or close the issue if the work is moot.`,
                `Editing or closing clears the \`${NEEDS}\` flag automatically.`,
                ``,
                `_Is the missing name the **subject** of this issue rather than a citation? Either direction counts — a token or file this issue will **create**, or one it exists to **remove** — and neither is a dead link a builder would follow. Add \`${OPT_OUT}\` to the body and this check will skip the issue._`,
              );
              const body = lines.join('\n');

              if (!h.labels.includes(NEEDS)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: h.n, labels: [NEEDS],
                }).catch(e => { if (e.status !== 404) throw e; });
              }

              // One comment per issue, rewritten in place — never a weekly
              // repost. Skipped entirely when the findings haven't changed.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: h.n, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(MARKER));
              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: h.n, body });
                core.info(`Flagged #${h.n} (${h.paths.size} paths, ${h.tokens.size} tokens)`);
              } else if (existing.body.trim() !== body.trim()) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`Updated #${h.n} (findings changed)`);
              } else {
                core.info(`#${h.n} unchanged — no comment written`);
              }
            }

            // Reconcile the other direction: anything still carrying the flag
            // whose citations now all resolve. This serves both entry points —
            // for a single edited issue it IS the self-clear, and for the weekly
            // sweep it catches issues fixed without an edit event.
            const flaggedNow = new Set(flagged.map(h => h.n));
            for (const i of issues) {
              if (!labelNames(i).includes(NEEDS)) continue;
              if (flaggedNow.has(i.number)) continue;
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: i.number, name: NEEDS,
              }).catch(e => { if (e.status !== 404) throw e; });
              core.info(`Cleared ${NEEDS} on #${i.number} — all citations resolve`);
            }

            core.summary
              .addHeading('stale-citation-sweep', 2)
              .addRaw(SINGLE
                ? `Scanned **#${single.number}** at ${context.payload.action}. `
                : `Scanned **${issues.length}** open issues. `)
              .addRaw(`Dead citations in **${hits.length}**, **${flagged.length}** flagged after exemptions.`)
              .write();
