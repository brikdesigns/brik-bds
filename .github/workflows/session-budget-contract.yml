name: session-budget-contract

# CI gate for the session size-budget check in lib/session-budget.sh — the
# enforcement half of .claude/references/session-contract.md § Entry.
#
# The ticket gate (#1485) already refuses a worktree with no ticket, so before
# this a session could open three L worktrees, pass every gate, and be four
# times over contract with nothing objecting. The budget was prose.
#
# The suite's load-bearing assertion is the boundary PAIR: 3 x M accepted at
# exactly 15/15, the 4th M refused with a non-zero exit. A gate that only warns
# would satisfy "a budget line was printed" and is indistinguishable from the
# prose it replaces — the suite carries a negative control for exactly that
# regression.
#
# Verify the suite still has teeth (flip _SB_BUDGET_POINTS to 99 and the
# boundary cases must fail):
#   bash scripts/test/test-session-budget.sh

on:
  pull_request:
    paths:
      - 'scripts/lib/session-budget.sh'
      - 'scripts/new-task.sh'
      - 'scripts/test/test-session-budget.sh'
      - '.claude/references/session-contract.md'
      - '.github/workflows/session-budget-contract.yml'

concurrency:
  group: session-budget-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-budget-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Budget arithmetic matches the canon, and exceeding it refuses
        run: bash scripts/test/test-session-budget.sh < /dev/null

      # --severity=warning: new-task.sh predates these gates and carries SC1091
      # (unfollowed `source`, unavoidable here) plus SC2001 style notes. Gating
      # on warning-and-above keeps real findings failing without demanding an
      # unrelated cleanup of the whole script in this PR.
      - name: shellcheck the gate + its test
        run: |
          shellcheck --severity=warning \
                     scripts/lib/session-budget.sh \
                     scripts/test/test-session-budget.sh \
                     scripts/new-task.sh
