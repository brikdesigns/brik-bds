name: gh Error Classify Check

# Locks the contract of scripts/lib/gh-error-classify.sh: a failed `gh` call must
# be named for what actually failed.
#
# Why a gate and not just a script: the helper exists because
# cleanup-merged-worktrees.sh read ANY `gh` failure — including a rate-limit 403 —
# as "gh CLI not authenticated". That script is gone (brikdesigns/brik-llm#2252 split
# it into the canonical sweep-merged-worktrees.sh plus sweep-board-claims.sh); the
# latter inherited the slug-resolution path and is the consumer gated below.
# On 2026-07-26 the fleet-shared 5,000-points/hour
# GraphQL bucket hit zero and that message sent a live session hunting a token
# problem while `gh auth status` was healthy the whole time
# (brikdesigns/brik-llm#1590 / #1587). A wrong label is worse than no label,
# and nothing in this repo would catch a regression to it.
#
# This file is a deliberate TWIN. Identical copies of the helper + test live in
# brik-llm/scripts/lib/ (gated by gh-quota-guardrails.yml) and
# brik-client-portal/scripts/lib/ (gated inside ci.yml). Separate git repos, so
# the copy is intentional — but an untested twin drifts silently, which is the
# class that produced brik-bds#1538.
#
# Cheap and hermetic: bash only, no npm ci, no build, no network. The rate-limit
# probe is stubbed via GH_CLASSIFY_RATE_LIMIT_JSON, so the gate spends zero
# GitHub quota — which matters, because quota is the thing it is about.

on:
  pull_request:
    paths:
      - 'scripts/lib/gh-error-classify.sh'
      - 'scripts/lib/tests/test-gh-error-classify.sh'
      - 'scripts/sweep-board-claims.sh'
      - 'scripts/lib/issue-claim.sh'
      - 'scripts/__tests__/test-issue-claim.sh'
      - 'scripts/lib/slug-claim.sh'
      - 'scripts/__tests__/test-slug-claim.sh'
      - '.github/workflows/gh-error-classify-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/gh-error-classify.sh'
      - 'scripts/lib/tests/test-gh-error-classify.sh'
      - 'scripts/sweep-board-claims.sh'
      - 'scripts/lib/issue-claim.sh'
      - 'scripts/__tests__/test-issue-claim.sh'
      - 'scripts/lib/slug-claim.sh'
      - 'scripts/__tests__/test-slug-claim.sh'
      - '.github/workflows/gh-error-classify-check.yml'
  workflow_dispatch:

concurrency:
  group: gh-error-classify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classification contract
        run: bash scripts/lib/tests/test-gh-error-classify.sh

      # issue-claim.sh became a consumer of the helper in brikdesigns/brik-llm#1754
      # (it resolves the repo slug via gh_repo_slug instead of spending a GraphQL
      # point on `gh repo view`). Its own suite already covers _ic_resolve_ref, so
      # gating it here is what stops the slug path regressing to the old shape.
      - name: Issue-claim contract
        run: bash scripts/__tests__/test-issue-claim.sh < /dev/null

      # slug-claim.sh sources issue-claim.sh for the staleness/identity half, so
      # it is a second consumer of the same slug-resolution path. Gated here for
      # the same reason: the per-slug marker keying is what stops one ticketless
      # branch blocking every other, and it fails silently (#1663).
      - name: Slug-claim contract
        run: bash scripts/__tests__/test-slug-claim.sh < /dev/null

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2148: sourced library, no shebang contract. SC1091: sourced at
          # runtime. SC2329 + SC2317: the tests define git()/gh() stubs that the
          # function under test calls indirectly, which shellcheck cannot see —
          # the exception it names itself. Newer builds than the local 0.11.0
          # report both, so both are excluded explicitly.
          shellcheck -e SC2148 scripts/lib/gh-error-classify.sh
          shellcheck -e SC1091,SC2329,SC2317 scripts/lib/tests/test-gh-error-classify.sh
          shellcheck -e SC1091 scripts/sweep-board-claims.sh
          # issue-claim.sh predates this gate and carries pre-existing findings,
          # so it is checked at the `-S warning` threshold brik-llm and
          # brik-client-portal use for these same libs — that clears info-level
          # SC2016 on :75-76 (literal `\(.*\)` inside single-quoted sed) without
          # blanket-excluding anything. SC1010 is excluded on top: :106 declares
          # a local named `then`, which is legal and deliberate. Both are left
          # as-is rather than edited, so this gate smuggles in no unrelated diff.
          shellcheck -S warning -e SC1091,SC1010 scripts/lib/issue-claim.sh
          # slug-claim.sh parses the claim table with the same single-quoted
          # sed as issue-claim.sh, so it carries the same info-level SC2016 on
          # the literal `\(.*\)`. Held at `-S warning` for that reason, not as a
          # blanket allowance. Its test suite has no such pattern and runs at the
          # default threshold.
          shellcheck -S warning -e SC1091 scripts/lib/slug-claim.sh
          shellcheck -e SC1091 scripts/__tests__/test-slug-claim.sh
