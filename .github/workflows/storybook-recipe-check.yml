name: Storybook Recipe Check

# Enforces ADR-007 (Storybook component page recipe) on every PR and on every
# push to main. Fails the build if any `components/ui/*/*.mdx` file deviates
# from the canonical Title → ComponentLinks → description → Playground →
# Variants → Patterns → Props shape.
#
# Why this is a CI gate (not just pre-commit):
#   - Pre-commit only runs when an MDX file is staged. CI catches regressions
#     introduced by surrounding edits (story exports renamed, component dirs
#     moved) that wouldn't trip the staged-file filter.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks.
#   - PRs from forks or fresh clones may not have husky installed.
#
# Source of truth: docs/adrs/ADR-007-storybook-page-recipe.md
# Lint script: scripts/lint-storybook-recipe.js

# No `paths:` filter — this is a REQUIRED status check (brik-bds#2129). A
# path-filtered required check never posts its context on a PR that touches no
# matching path, which blocks that PR indefinitely. Running the lint (~20s)
# unconditionally is the skip-safe way to keep the context reliable. It caught
# #2118's dangling MDX refs on PR #2125 but wasn't required, so #2125 merged
# red and broke main; requiring it is the actual fix.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Merge-queue readiness (#2415): GitHub re-runs branch-protection required
  # checks against the merge group, so a required context must also trigger on
  # `merge_group` or the queue wedges. This gate operates on the checked-out
  # tree, so it runs unchanged on the rebased merge-group ref.
  merge_group:

concurrency:
  # `cancel-in-progress: false` + `queue: max`, required as a pair because
  # `storybook-recipe-check` is a REQUIRED context on `main` (#2142 promoted it;
  # #2322 is the miss this fixes). Rules 6a/6b of
  # brik-llm/scripts/audit/required-check-contract.py:
  #
  #   - A cancelled check-run is not an absent one. Protection goes on reporting
  #     the context as `expected`, and a green re-run does not clear it — only a
  #     new head SHA does (#2094).
  #   - `cancel-in-progress: false` ALONE does not cover it. That flag governs
  #     the RUNNING job; the default `queue: single` still lets a newer run evict
  #     the PENDING one, leaving a check-suite with zero check-runs and the same
  #     stuck `expected` (#2176; measured on #2174 — seven runs on one head SHA,
  #     five cancelled). That is why #2094's fix did not hold.
  #
  # `queue: max` and `cancel-in-progress: true` are a workflow validation error
  # together, so the two lines always change as a pair.
  group: storybook-recipe-check-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  storybook-recipe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Storybook recipe check
        run: node scripts/lint-storybook-recipe.js --enforce
