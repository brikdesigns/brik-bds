name: Blueprints Astro Check

# Packs the BDS tarball, installs it into a scratch Astro 5 project, and proves
# the `blueprints-astro` subpath resolves and renders — `astro check` for the
# type + import resolver, then `astro build` plus HTML assertions on the built
# output (exports, section shell, dispatcher key resolution, fallback path).
#
# Why this exists as a gate: the script already existed but ran nowhere.
# `rg "verify:blueprints-astro" .github/ scripts/git-hooks/ package.json`
# matched only `package.json:255`, so when #2010 de-wired `stats_bar` and
# left the dispatcher assertion expecting it, the script went red on `main` and
# nothing reported it (brik-bds#2313).
#
# Budget: path-gated to blueprint sources + the script itself, so it does not
# fire on component, token, or docs work. Script runtime measured at 17.7s
# locally; job cost is dominated by `npm ci`, `playwright install --with-deps
# chromium`, and the scratch project's own `npm install` — the first CI run
# reached the axe step at 55s, so budget ~2 min per firing.
# It replaces no existing gate — `validate:blueprints` checks declarations
# against each other and never builds, and `esm-bundle-check` covers the React
# bundle, not the Astro subpath.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'content-system/blueprints/**'
      - 'scripts/verify-blueprints-astro-exports.mjs'
      - 'scripts/render-astro-blueprints.mjs'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'content-system/blueprints/**'
      - 'scripts/verify-blueprints-astro-exports.mjs'
      - 'scripts/render-astro-blueprints.mjs'
      - 'package.json'

concurrency:
  group: blueprints-astro-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blueprints-astro-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The script's axe-core pass drives Chromium via Playwright. Local runs
      # reuse a cached browser; a bare runner has none and the scan fails with
      # "Executable doesn't exist at …/chrome-headless-shell". Same idiom as
      # test.yml:69. Not the pinned `visual.yml` container — that image is
      # load-bearing for screenshot baseline naming, which this gate does not
      # produce.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `verify:astro-stories` (ADR-039) ran in NO workflow before this. It was
      # wired only into `npm run validate`, which nothing in .github/ invokes —
      # `release.yml` runs an explicit subset that excludes it. So a stale
      # pre-render could reach `main` with every check green, and one did: the
      # Astro 5 -> 7 bump (#2462) invalidated all 12 committed files 22 minutes
      # after #2455 merged, and no check went red (#2474).
      #
      # Rides this job rather than a new workflow: the trigger it needs
      # (`content-system/blueprints/**`, `package.json`) is already here and the
      # runner is already warm. ~2s on a job that runs ~1m35s. No new required
      # context, no new trigger.
      - name: Astro story render is current
        run: npm run verify:astro-stories

      - name: Blueprints Astro export + render check
        run: npm run verify:blueprints-astro
