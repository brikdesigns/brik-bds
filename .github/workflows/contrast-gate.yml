name: Contrast Gate

# Enforces the canonical WCAG AA contrast-pairing set on every PR and on every
# push to main. Resolves every pairing in `tokens/contrast-pairings.json`
# against its foreground + background token in the Brik LIGHT and DARK default
# themes and fails the build if any real pairing drops below its WCAG threshold
# (AAA 7:1 / AA 4.5:1 / AA-large 3:1). Tracked `darkException` pairings are
# reported, not failed (see scripts/validate-themes.js).
#
# Why this is a CI gate (not just pre-push):
#   - validate-themes.js already runs on local pre-push via `validate:full`
#     (scripts/validate-all.js → "Theme Compliance") and at release
#     (release.yml → contrast-gate). Neither stops a regression from *merging*.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks.
#   - PRs from forks or fresh clones may not have husky installed.
# This workflow is the cross-machine CI check that surfaces an AA regression on
# every PR to main between releases — narrowing the gap that let the #563
# contrast regression (10 service pairings, only 1 passing AA) merge and ship.
# NOTE: it is not yet a required status check, so a red run does not itself block
# merge; enforcement rests on merge-wait discipline until it is promoted.
#
# Source of truth: tokens/contrast-pairings.json
# Docs: https://design.brikdesigns.com/docs/primitives/color-pairings
# Issue: brikdesigns/brik-bds#573 (parent #526 — WCAG AA contrast contract)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: contrast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The gate reads committed source tokens (tokens/figma-tokens.css,
      # tokens/figma-tokens-dark.css, tokens/gap-fills.css,
      # tokens/theme-brand-brik.css) + tokens/contrast-pairings.json directly —
      # no dist build required (unlike canonical-check, which parses dist/).
      - name: Contrast pairing gate
        run: npm run contrast-gate

      # The published matrix in primitives/color-pairings.mdx must match the
      # generator (measured ratios included) so it can't drift as tokens change.
      - name: Contrast matrix drift check
        run: npm run contrast-matrix:check

      # Every Brand Kit override of a generated token must say why. Without this,
      # a typo and a brand decision look identical in the diff — which is how
      # --background-inverse shipped pinned to --text-inverse's own value and
      # rendered two components at 1.00:1 for four months (#1686, found only
      # because someone measured dark mode by hand). Lives here rather than in a
      # new workflow because it reads the same four token files and answers the
      # same question: is this colour deliberate? (#1689)
      - name: Theme divergence lint
        run: npm run lint-theme-divergence

      # ADR-015 brand-text rule: --text-brand-primary (3.78:1) never on small
      # body copy. Advisory in the pairing gate (scores pairings, not sizes) —
      # asserted here (#1064 AC1).
      - name: Brand-text usage lint
        run: npm run lint-brand-text

      # ADR-028's disabled mechanisms: every disabled-scoped rule reads
      # var(--state-disabled-opacity) or the --*-disabled trio. The pairing gate
      # above scores the token's VALUE (via the `alpha` field #1687 added);
      # nothing scored whether components still READ it, and the visual gate
      # cannot — ADR-010 Q2 makes `disabled` an argTypes control, so 27 of the
      # 28 disabled states have no baseline to move (#1697). Lives here because
      # it answers the other half of the same question the pairing gate asks:
      # is this disabled state actually legible?
      - name: Disabled-treatment lint
        run: npm run lint-disabled-fade
