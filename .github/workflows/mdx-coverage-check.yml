name: MDX Coverage Check

# Runs scripts/lint-mdx-coverage.mjs on every PR (and push to main) that touches
# a component, its stories/index/MDX, or the checker itself. Fails when a PUBLIC
# component export (an index.ts re-export) is missing from its sibling MDX page —
# the drift that leaves a shipped component invisible to Chromatic and to the
# Storybook MCP payload consumer-repo agents rely on.
#
# Why this is a CI gate (not just pre-push):
#   - Pre-push runs `validate:full` (scripts/validate-all.js → "MDX Coverage")
#     locally, but that never runs in CI.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks.
#   - Fork / fresh-clone PRs may not have husky installed.
#
# No build step: the checker only reads index.ts + .tsx + MDX text — no token
# registry, no Storybook build. Path-filtered, so most PRs skip the job entirely.
#
# Issue: brikdesigns/brik-bds#1495

on:
  pull_request:
    branches:
      - main
    paths:
      - 'components/ui/**'
      - 'scripts/lint-mdx-coverage.mjs'
      - 'package.json'
      - '.github/workflows/mdx-coverage-check.yml'
  push:
    branches:
      - main
    paths:
      - 'components/ui/**'
      - 'scripts/lint-mdx-coverage.mjs'
      - 'package.json'
      - '.github/workflows/mdx-coverage-check.yml'

concurrency:
  group: mdx-coverage-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mdx-coverage-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check MDX coverage
        run: node scripts/lint-mdx-coverage.mjs
