name: Test Suite

# Runs the Vitest suite on every PR and on every push to main.
#
# Why this is a CI gate (not just a local hook):
#   - Pre-commit runs token + JSDoc + recipe + typecheck — NOT tests.
#   - Pre-push runs `validate:full` (scripts/validate-all.js), which runs
#     JSDoc Lint + Grid Audit + TypeScript — the test suite is absent.
#   - `pr-task.sh` re-runs tests POST-merge, so a regression is only caught
#     after it has already landed on main.
#   - Cloud-agent commits and fork PRs bypass local hooks entirely.
# This workflow is the pre-merge guarantee that component regressions can't
# land green. Suite is ~17s + setup; cheap enough to run on every PR.
#
# Issue: brikdesigns/brik-bds#891

# A README-only PR cannot break a component unit test, so it should not pay for
# the suite (brik-llm#2713 — the visual + test suites are 57% of the org's
# Actions runtime). `test` is NOT a required context on `main`
# (.github/required-checks.json), so unlike `visual` it can be workflow-level
# path-filtered: on an all-inert diff the trigger does not match and no `test`
# check-run is produced at all. This is the #2070 house pattern, but expressed
# as `paths-ignore` (skip ONLY provably-inert files) rather than an INCLUDE
# `paths:` list — an include list can never be trusted for a suite whose input
# is ~all of source, so the default here is to run and only an exclusively
# docs/markdown diff opts out.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The `widgets` vitest project runs in browser mode via
      # @vitest/browser-playwright → Chromium. Local runs reuse a cached
      # browser; CI has none, so install it (with OS deps) before the suite.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Full suite, all projects. The `storybook` browser project was excluded
      # while #571 (cold-cache dep-optimizer reload → "Vitest failed to find
      # the current suite") was unfixed; vitest.config.ts now pre-bundles the
      # story deps via optimizeDeps.include, so it runs deterministically and
      # is back in the gate.
      - name: Run Vitest suite
        run: npm test
