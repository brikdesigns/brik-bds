name: Same-Path Overlap Check

# Gates scripts/lib/pr-path-overlap.sh and its two entry points.
#
# This workflow is NEW, and its absence is the reason it exists: the lib and
# scripts/__tests__/test-pr-path-overlap.sh have both been in this repo since
# brik-bds#1545, and no workflow ran the test (verified 2026-08-18 —
# `rg -n "pr-path-overlap" .github/workflows/` returned nothing). brik-llm has
# run the identical suite in pr-task-contract.yml the whole time, so the twin
# that could rot silently was this one. Mirroring brik-llm#2313 into an ungated
# copy would have shipped a second untested gate.
#
# What the suite locks:
#
#   - exact-path matching, because a directory-level heuristic is how the
#     keyword check in new-task.sh produces noise, and a warning that is usually
#     wrong gets skipped
#   - self-exclusion by HEAD REF at PR-create, because this branch has no PR
#     number to compare against yet
#   - at task-start (brik-llm#2313), a ticket-text path only counts if
#     `git ls-files` lists it, and an ambiguous bare basename resolves to
#     nothing — an under-report beats a wrong report (brik-llm#2101)
#   - a failed `gh` call is never silence: it says SKIPPED, never all-clear
#   - new-task.sh still CALLS the task-start check, before `git worktree add`.
#     Every other assertion passes with the call site deleted, which is exactly
#     how new-task.sh's earlier overlap gates rotted (lib/overlap-filters.sh).
#
# The test runs with stdin closed, matching every agent session: the lib must
# warn and continue rather than block on `read`.
#
# Cheap and hermetic: bash only, no npm ci, no build, no network, no gh quota.

on:
  pull_request:
    paths:
      - 'scripts/lib/pr-path-overlap.sh'
      - 'scripts/new-task.sh'
      - 'scripts/pr-task.sh'
      - 'scripts/__tests__/test-pr-path-overlap.sh'
      - '.github/workflows/pr-path-overlap-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/pr-path-overlap.sh'
      - 'scripts/new-task.sh'
      - 'scripts/pr-task.sh'
      - 'scripts/__tests__/test-pr-path-overlap.sh'
      - '.github/workflows/pr-path-overlap-check.yml'
  workflow_dispatch:

concurrency:
  group: pr-path-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-path-overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stdin closed is the agent-session condition: warn, never block.
      - name: Same-path overlap contract
        run: bash scripts/__tests__/test-pr-path-overlap.sh < /dev/null

      # SC1091 = unresolvable `source` of a sibling lib; SC2148 = missing
      # shebang in a file that is only ever sourced. Same exclusions brik-llm's
      # pr-task-contract.yml uses on the same two files.
      - name: shellcheck the lib and its test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC1091,SC2148 \
            scripts/lib/pr-path-overlap.sh \
            scripts/__tests__/test-pr-path-overlap.sh
