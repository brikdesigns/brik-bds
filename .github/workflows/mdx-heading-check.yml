name: MDX Heading Check

# Runs scripts/lint-mdx-headings.mjs on every PR (and push to main) that touches
# the docs corpus or the checker itself. Enforces the heading hard rule from
# .claude/standards/fumadocs-content.md: an `##`/`###` heading or a frontmatter
# `title` may not contain an em dash, backtick, parenthetical, slash, or arrow —
# headings are scannable labels, not sentences. One trailing <Badge /> component
# is allowed.
#
# Why this is a CI gate (not just pre-push):
#   - Pre-push runs `validate:full` (scripts/validate-all.js → "MDX Headings")
#     locally, but that never runs in CI.
#   - Cloud-agent commits (OpenClaw, scheduled routines) bypass local hooks.
#   - Fork / fresh-clone PRs may not have husky installed.
# Wave 2 of #1358 de-cluttered ~85 headings by hand; without this gate the
# clutter re-accretes one PR at a time (the drift class the whole project fixes).
#
# No build step: the checker only reads MDX text — no token registry, no
# Storybook build. Path-filtered, so most PRs skip the job entirely.
#
# Issue: brikdesigns/brik-bds#1362

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs-site/content/docs/**'
      - 'scripts/lint-mdx-headings.mjs'
      - 'package.json'
      - '.github/workflows/mdx-heading-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs-site/content/docs/**'
      - 'scripts/lint-mdx-headings.mjs'
      - 'package.json'
      - '.github/workflows/mdx-heading-check.yml'

concurrency:
  group: mdx-heading-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mdx-heading-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check MDX heading copy
        run: node scripts/lint-mdx-headings.mjs
