name: Token Self-Reference Check

# Fails the build when a custom property in `tokens/*.css` substitutes itself
# (`--x: var(--x)`), directly or through a cycle.
#
# Why this needs its own gate: a cycle is invalid at computed-value time (CSS
# Custom Properties §3.2), so the name resolves to the guaranteed-invalid value
# — it is *unset*, and an earlier correct declaration does NOT come back. The
# cascade picks the winning declaration first, then the cycle poisons it.
#
# Why nothing caught it: `tokens/bridge.css` carried fifteen of these. It ships
# as `@brikdesigns/bds/bridge.css` and is NOT concatenated into
# `dist/tokens.css`, so Token Shadow Check never reads it. Verified in Chromium
# against the real dist files — `dist/tokens.css` alone resolves
# `--border-radius-md` to `12px`; adding `dist/bridge.css` resolves it to the
# empty string.
#
# Reads source, so unlike Token Shadow Check it needs no `build:dist-tokens`.
#
# Sibling gates: token-shadow-check.yml (declared twice, earlier one dead),
# cascade-contract-check (a consumer redefining canon), canonical-check (an
# invented name in a consumer).
#
# Issue: brikdesigns/brik-bds#1919 · class: brikdesigns/brik-llm#2206

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tokens/**'
      - 'scripts/lint-token-self-reference.mjs'
      - 'scripts/__tests__/lint-token-self-reference.test.mjs'
      - '.github/workflows/token-self-reference-check.yml'
  push:
    branches:
      - main
    paths:
      - 'tokens/**'
      - 'scripts/lint-token-self-reference.mjs'
      - 'scripts/__tests__/lint-token-self-reference.test.mjs'
      - '.github/workflows/token-self-reference-check.yml'

concurrency:
  group: token-self-reference-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token-self-reference-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Token self-reference check
        run: npm run lint-token-self-reference

      # The gate's own proof. `assertions-must-be-proven-to-fail`: these cases
      # plant a self-reference and require a non-zero exit, so a gate that
      # silently stops detecting anything fails here rather than going quietly
      # green. Includes the exact #1919 shape — good value upstream, poisoned by
      # a later re-declaration.
      - name: Gate self-test (proves it fails)
        run: npx vitest run scripts/__tests__/lint-token-self-reference.test.mjs
