name: Visual Regression

# Self-hosted visual gate (ADR-026 Arm B, #1637). Re-runs the `storybook`
# vitest project with VISUAL_GATE=1 — arms a toMatchScreenshot afterEach on
# every story (.storybook/vitest.visual.setup.ts) against the committed
# baselines in tests/visual/__screenshots__/.
#
# The container image is load-bearing, not a convenience: baselines are named
# per browser + platform and pixel output shifts with font/GPU stacks, so
# references are only valid inside this exact image. Bump the tag DELIBERATELY,
# in lockstep with the `playwright` npm dependency, and regenerate baselines in
# the same PR (run the Update Visual Baselines workflow on the branch).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # MEASUREMENT SCAFFOLD (#1732) — TEMPORARY, reverted before merge.
      #
      # `Pagination :: With Result Count` reports 1043 px at threshold 0.05 and
      # 0 at 0.1 on a clean tree (run 31137880167). Either text antialiasing
      # below the perceptual floor, or a stale baseline like the one #1696
      # found on `TextLink :: In Paragraph` — and until it is attributed, no
      # one can argue for going below 0.1.
      #
      # Re-runs the clean tree at 0.05 with allowedMismatchedPixels: 0, which
      # forces the comparator to FAIL the story and therefore to write both the
      # diff PNG and the actual screenshot. Those two artifacts are the
      # discriminator: scattered pixels along glyph edges = antialiasing, a
      # coherent region = a real change. The actual PNG also lets the count be
      # re-derived at any threshold offline, against the committed baseline,
      # without burning another container run.
      - name: Measure — threshold 0.05, floor 0, clean tree
        continue-on-error: true
        run: VISUAL_GATE=1 VISUAL_THRESHOLD=0.05 VISUAL_FLOOR_PIXELS=0 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/measure-t005-clean.json

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagination-attribution
          path: |
            /tmp/measure-t005-clean.json
            tests/visual/__diffs__/
            **/.vitest-attachments/
          if-no-files-found: error
          retention-days: 7

      - name: Run visual regression suite
        run: VISUAL_GATE=1 npx vitest run --project storybook

      # On failure, the diff PNGs (and vitest's actual-screenshot attachments)
      # are the review surface — there is no hosted UI (ADR-026 tradeoff).
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tests/visual/__diffs__/
            **/.vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14
