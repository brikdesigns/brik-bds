name: Visual Regression

# Self-hosted visual gate (ADR-026 Arm B, #1637). Re-runs the `storybook`
# vitest project with VISUAL_GATE=1 — arms a toMatchScreenshot afterEach on
# every story (.storybook/vitest.visual.setup.ts) against the committed
# baselines in tests/visual/__screenshots__/.
#
# The container image is load-bearing, not a convenience: baselines are named
# per browser + platform and pixel output shifts with font/GPU stacks, so
# references are only valid inside this exact image. Bump the tag DELIBERATELY,
# in lockstep with the `playwright` npm dependency, and regenerate baselines in
# the same PR (run the Update Visual Baselines workflow on the branch).
#
# ─── #1778: what actually goes wrong here, and what does not ────────────────
#
# The gate loses browser pages mid-run. A lost page reports as a suite-level
# `NetworkError: A network error occurred.` with its tests SKIPPED, so it is
# indistinguishable in raw vitest output from a real screenshot mismatch — and
# 121 of them read as 121 visual regressions. The `Classify` step below is what
# makes the two legible; it, not vitest, owns the job verdict.
#
# THREE LEVERS WERE MEASURED AND NONE OF THEM DETERMINES THE OUTCOME:
#
#   run         | /dev/shm | workers | result  | suites dropped
#   ------------|----------|---------|---------|---------------
#   31595897130 |    64 MB |    2    | PASS    |   0
#   31596457904 |    64 MB |    2    | fail    | 121
#   31603449967 |    64 MB |    2    | fail    | 126
#   31607031103 |   7.9 GB |    2    | fail    |  64
#   31607740675 |   7.9 GB |    1    | PASS    |   0
#   31608413482 |   7.9 GB |    1    | fail    |  82
#
# Every configuration has both a pass and a fail. So:
#   · #1781's `--maxWorkers=2` did not fix it (rows 2-3 are that config).
#   · `--ipc=host` did not fix it either (rows 4 and 6).
#   · `--maxWorkers=1` did not fix it (rows 5-6 are the same config, one each).
#
# Anyone reaching for one of these knobs again: it has been tried. Two
# consecutive greens is what made #1781 look like a fix; at this pass rate two
# greens in a row happens by luck often enough to be worthless as evidence. The
# bar is ten consecutive greens on one commit.
#
# What the shape does say: the drops are runner-capacity-driven and external to
# the repo. The same tree ran reliably green on 2026-08-10 and started dropping
# on 2026-08-11 with an identical container digest and nothing landed between.
# So this workflow stops trying to out-tune the fleet and instead bounds its
# exposure — small shards in fresh containers, plus a retry that fires ONLY for
# the drop class, never for a real regression. That retry is deliberate and
# earned: the issue allowed one "only if the measurement shows the drop is
# genuinely unavoidable," and the table above is that measurement.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual runs exist to make the ten-consecutive-greens bar in #1778
  # MEASURABLE. Until this trigger, the only way to sample the gate's pass rate
  # was to generate real PR or push traffic, so the bar could be waited on but
  # never actually run — and a bar nobody can measure is not a bar.
  workflow_dispatch:

concurrency:
  # Manual runs get their own group so a campaign does not cancel itself.
  #
  # `cancel-in-progress` is right for pull_request and push — a superseded
  # commit's result is worthless, so grouping those on the ref is correct and is
  # left exactly as it was. It is wrong for workflow_dispatch: sampling the same
  # commit N times is the entire point, and under a ref-keyed group each
  # dispatch would cancel the previous one. Ten dispatches would have yielded
  # one result and nine cancellations, which reads as "the bar is unreachable"
  # rather than "the trigger is misconfigured".
  #
  # run_id is unique per run, so every manual run is its own group. Adding the
  # trigger without this is the whole change silently not working.
  group: visual-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  # Shards run the suite in slices. 146 suites in one browser session was the
  # exposure: reds completed as few as 20 suites before pages started dying, so
  # a slice of ~19 keeps each session inside the range that has never failed
  # mid-slice. Fresh container per shard means a fresh browser and a fresh
  # /dev/shm, so one bad slice cannot poison the rest.
  #
  # This job is deliberately NOT named `visual` — a matrix would expand it to
  # `visual (1)`, `visual (2)`, … and the branch-protection check named `visual`
  # would never appear again. The aggregate job below carries that name.
  shard:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the others — the whole point is to
      # see the per-shard drop counts in one run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Docker gives a container a 64 MB /dev/shm by default and Chromium
      # allocates screenshot bitmaps there. Playwright: "Using --ipc=host is
      # recommended when using Chromium. Without it, Chromium can run out of
      # memory and crash." https://playwright.dev/docs/docker
      #
      # Kept because it removes a documented failure mode and costs nothing —
      # NOT because it fixed #1778. It did not (see the table above). Without it
      # the browser died outright and the run coasted to the end losing every
      # remaining suite; with it, a bad run degrades instead, dropping pages
      # individually while the Vite server stays up. Better shape, same verdict.
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Capacity the runner actually gave us. `shm:` is first because it is the
      # ceiling `free -m` does not show — expect ~7.9G from --ipc=host, and if
      # it ever reads 64M the container options were dropped.
      - name: Report runner capacity
        run: |
          echo "shm:   $(df -h /dev/shm | tail -1)"
          echo "nproc: $(nproc)"
          free -m || true
          # Monospace faces actually installed in this image. The gate's mono
          # stack is all macOS/Windows faces, so code spans land on the generic
          # fontconfig alias and flake by 372px between runs (#1785). Printed so
          # the eventual pin is chosen against what is really here.
          echo "mono faces:"
          fc-list 2>/dev/null | grep -i mono | sed 's/^/  /' | sort -u || echo "  (fc-list unavailable)"

      # This container has no bash on the Actions default path, so steps run
      # under `sh -e`. No bashisms (`set -o pipefail` fails as "Illegal option").
      #
      # `|| true` on vitest hands the verdict to the classifier, which is the
      # only thing that can tell a dropped page from a regression. The retry
      # fires ONLY on exit 2 (drops, zero real failures). Exit 1 — any real
      # regression, or any failure shape the classifier does not recognise — is
      # returned immediately and never retried, so a genuine mismatch can never
      # be retried away.
      - name: Run visual regression shard
        env:
          SHARD: ${{ matrix.shard }}/8
          # Attempts for the drop class only. A whole-shard retry was too coarse
          # — shard 5 went 16 drops -> 3 and shard 8 went 10 -> 11 on run
          # 31609177266, because re-running all 19 suites re-exposes the healthy
          # ones. Retrying only the files that died converges instead: each round
          # is a handful of suites, so the surviving set shrinks monotonically.
          DROP_ATTEMPTS: '4'
        run: |
          classify() {
            set +e
            node scripts/classify-visual-failure.mjs visual-report.json
            CLASS=$?
            set -e
          }

          # Full shard, then classify.
          VISUAL_GATE=1 npx vitest run --project storybook --maxWorkers=1 \
            --shard="$SHARD" \
            --reporter=default --reporter=json \
            --outputFile=visual-report.json || true
          classify

          # Exit 1 is a real regression, or a failure shape the classifier does
          # not recognise. Never retried — that is the whole point of separating
          # the classes, and retrying here would defeat the gate.
          if [ "$CLASS" -eq 1 ]; then
            exit 1
          fi

          # Exit 2 is drops only: retry just the files that died, up to
          # DROP_ATTEMPTS rounds, until none is left.
          n=0
          while [ "$CLASS" -eq 2 ] && [ "$n" -lt "$DROP_ATTEMPTS" ]; do
            n=$((n + 1))
            node scripts/classify-visual-failure.mjs visual-report.json --list-drops > dropped.txt
            COUNT=$(wc -l < dropped.txt | tr -d ' ')
            echo ""
            echo "↻ retry $n/$DROP_ATTEMPTS — re-running $COUNT dropped suite(s) only:"
            sed 's/^/    /' dropped.txt
            echo ""
            # No --shard here: the file list already IS the selection. Passing
            # both would re-shard the list and silently run a fraction of it.
            VISUAL_GATE=1 npx vitest run --project storybook --maxWorkers=1 \
              $(tr '\n' ' ' < dropped.txt) \
              --reporter=default --reporter=json \
              --outputFile=visual-report.json || true
            classify
            # A retry that surfaces a real regression is a real regression.
            if [ "$CLASS" -eq 1 ]; then
              echo "✗ a retried suite failed for real, not as a drop — not retrying further."
              exit 1
            fi
          done

          if [ "$CLASS" -eq 2 ]; then
            echo "✗ suites still dropping after $DROP_ATTEMPTS targeted retries — this is"
            echo "  not transient. Do not raise DROP_ATTEMPTS; read #1778 first."
          fi
          exit "$CLASS"

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-shard-${{ matrix.shard }}
          path: |
            tests/visual/__diffs__/
            **/.vitest-attachments/
            visual-report.json
          if-no-files-found: ignore
          retention-days: 14

  # The branch-protection check. Keeps the name `visual` stable while the work
  # above fans out, and fails if ANY shard failed — `needs` alone would let a
  # skipped/failed shard pass this job, so the result is asserted explicitly.
  visual:
    name: visual
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    steps:
      - name: Assert every shard passed
        run: |
          echo "shard job result: ${{ needs.shard.result }}"
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "✗ at least one visual shard did not pass — open the shard jobs above."
            echo "  Each shard prints its own drop-vs-regression classification (#1778)."
            exit 1
          fi
          echo "✓ all 8 visual shards passed."
