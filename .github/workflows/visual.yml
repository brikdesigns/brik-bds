name: Visual Regression

# Self-hosted visual gate (ADR-026 Arm B, #1637). Re-runs the `storybook`
# vitest project with VISUAL_GATE=1 — arms a toMatchScreenshot afterEach on
# every story (.storybook/vitest.visual.setup.ts) against the committed
# baselines in tests/visual/__screenshots__/.
#
# The container image is load-bearing, not a convenience: baselines are named
# per browser + platform and pixel output shifts with font/GPU stacks, so
# references are only valid inside this exact image. Bump the tag DELIBERATELY,
# in lockstep with the `playwright` npm dependency, and regenerate baselines in
# the same PR (run the Update Visual Baselines workflow on the branch).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # MEASUREMENT SCAFFOLD (#1729) — TEMPORARY, reverted before merge.
      #
      # #662 AC 5 — show a historical regression failing the gate. The W2
      # rollback (portal#553) had two halves and only one is this gate's job:
      # its invented names (--text-on-paper, --surface-paper-elevated, +10) are
      # already rejected statically by scripts/canonical-check.mjs, before a
      # pixel is rendered, so reconstructing that half proves nothing.
      #
      # The half no static check can see is a CANONICAL name carrying a wrong
      # value. Both tokens below pass canonical-check; only the render shows
      # the regression. tokens/theme-brand-brik.css is the definition that
      # actually wins in Storybook (`brik` light theme, preview.tsx load order)
      # — figma-tokens.css declares --text-secondary one step lighter and is
      # overridden.
      #
      # Case 1 is a loud hue swap (YIQ delta 8008) — establishes the gate sees
      # the token layer at all. Case 2 is the load-bearing one: one grayscale
      # step, delta 768.6, which sits INSIDE the window #1727 opened (over
      # 0.1's bar of 352.2, under 0.2's 1408.6) — the same window that hid
      # Badge Default at 934 and Neutral at 486. Running case 2 at 0.2 shows
      # the pre-#1727 gate passing it silently, which is what makes this a
      # demonstration rather than an assertion.
      - name: Apply case 1 — high-contrast, --text-primary → wrong hue
        run: |
          sed -i '27s|--color-grayscale-darkest|--color-system-red|' tokens/theme-brand-brik.css
          sed -n '27p' tokens/theme-brand-brik.css

      - name: Case 1 — shipped gate (0.1 / floor 10), expected FAIL
        continue-on-error: true
        run: VISUAL_GATE=1 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/case1-shipped.json

      - name: Case 1 — per-story counts at floor 0
        continue-on-error: true
        run: VISUAL_GATE=1 VISUAL_FLOOR_PIXELS=0 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/case1-floor0.json

      - name: Revert case 1, apply case 2 — low-contrast, --text-secondary one step lighter
        run: |
          git checkout HEAD -- tokens/theme-brand-brik.css
          grep -q 'grayscale-darkest' tokens/theme-brand-brik.css || { echo "case 1 revert failed"; exit 1; }
          sed -i '36s|--color-grayscale-darker|--color-grayscale-dark|' tokens/theme-brand-brik.css
          sed -n '36p' tokens/theme-brand-brik.css

      - name: Case 2 — shipped gate (0.1 / floor 10), expected FAIL
        continue-on-error: true
        run: VISUAL_GATE=1 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/case2-shipped.json

      - name: Case 2 — per-story counts at floor 0
        continue-on-error: true
        run: VISUAL_GATE=1 VISUAL_FLOOR_PIXELS=0 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/case2-floor0.json

      - name: Case 2 — pre-#1727 gate (0.2 / floor 10), expected PASS silently
        continue-on-error: true
        run: VISUAL_GATE=1 VISUAL_THRESHOLD=0.2 npx vitest run --project storybook --reporter=default --reporter=json --outputFile=/tmp/case2-t020.json

      - name: Revert case 2
        run: |
          git checkout HEAD -- tokens/theme-brand-brik.css
          git diff --exit-code -- tokens/theme-brand-brik.css

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-value-repro-measurements
          path: /tmp/case*.json
          if-no-files-found: error
          retention-days: 7

      # Control + green proof: the tree is back to HEAD, so this is the
      # unmodified gate on an unmodified tree and must pass.
      - name: Run visual regression suite
        run: VISUAL_GATE=1 npx vitest run --project storybook

      # On failure, the diff PNGs (and vitest's actual-screenshot attachments)
      # are the review surface — there is no hosted UI (ADR-026 tradeoff).
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tests/visual/__diffs__/
            **/.vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14
