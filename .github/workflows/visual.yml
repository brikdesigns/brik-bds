name: Visual Regression

# Self-hosted visual gate (ADR-026 Arm B, #1637). Re-runs the `storybook`
# vitest project with VISUAL_GATE=1 — arms a toMatchScreenshot afterEach on
# every story (.storybook/vitest.visual.setup.ts) against the committed
# baselines in tests/visual/__screenshots__/.
#
# The container image is load-bearing, not a convenience: baselines are named
# per browser + platform and pixel output shifts with font/GPU stacks, so
# references are only valid inside this exact image. Bump the tag DELIBERATELY,
# in lockstep with the `playwright` npm dependency, and regenerate baselines in
# the same PR (run the Update Visual Baselines workflow on the branch).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # --ipc=host is load-bearing, not tuning. Docker gives a container a 64 MB
      # /dev/shm by default; Chromium allocates screenshot bitmaps there, so the
      # gate exhausted it mid-run and the browser died — 121/146 suites dropped
      # on `main` (run 31596457904) with ZERO failed tests. Playwright documents
      # exactly this: "Using --ipc=host is recommended when using Chromium.
      # Without it, Chromium can run out of memory and crash."
      # https://playwright.dev/docs/docker
      #
      # This is why `npm test` (test.yml) runs the SAME 146 storybook suites and
      # stays green while only VISUAL_GATE=1 fails: the screenshot capture is
      # what allocates in /dev/shm. It is also why `free -m` looked healthy in
      # every red run (14 GB available) — system RAM was never the constraint,
      # shared memory was, and free -m does not show that ceiling.
      #
      # Necessary but NOT sufficient on its own: with 7.9 GB of shm and two
      # workers the gate still lost 64 suites (it stopped dying outright and
      # completed instead, dropping pages individually). See the worker cap
      # below — both halves are required.
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Capacity the runner actually gave us. Kept after the #1778 fix because
      # the drop was invisible without it. /dev/shm is listed FIRST: that is the
      # ceiling that actually broke the gate, and it is the one `free -m` does
      # not show. Expect ~7.8 GB (half of RAM, the --ipc=host default), not the
      # 64 MB Docker gives an isolated container.
      - name: Report runner capacity
        run: |
          echo "shm:   $(df -h /dev/shm | tail -1)"
          echo "nproc: $(nproc)"
          free -m || true

      # --maxWorkers=1: ONE browser page capturing screenshots at a time. Both
      # halves of #1778 were needed and each is measured.
      #
      # The measurement that chose this number, all on --ipc=host:
      #
      #   workers | /dev/shm | result                          | vitest wall
      #   --------|----------|---------------------------------|------------
      #   default |    64 MB | 121/146 dropped (run 31596457904)|  75.96s (died)
      #        2  |    64 MB | 93 then 126 dropped (PR #1783)  |  ~76s   (died)
      #        2  |   7.9 GB | 64 dropped, run completed        |  99.49s
      #        1  |   7.9 GB | 146/146 PASS (run 31607740675)   | 131.38s
      #
      # Read the third row against the fourth: raising shm stopped the browser
      # dying outright but two concurrent screenshot captures still lost pages.
      # Only one page at a time is actually green.
      #
      # The cap is free. 131.38s at workers=1 vs 134.74s for the best
      # workers=2 green (run 31595897130) — the gate serialises on I/O, not CPU,
      # so removing the second page costs no wall clock. Do not "optimise" this
      # back up: #1781 raised the same lever on two consecutive greens against a
      # ~1-in-3-green process and read luck as a fix. Ten consecutive greens on
      # one commit is the bar; anything less cannot distinguish the two.
      #
      # If the suite outgrows this (a single page is now the floor, so the next
      # lever is wall clock, not concurrency), shard across a matrix rather than
      # raising the worker count.
      #
      # The JSON report feeds the classifier below. `|| true` hands the verdict
      # to that step instead of failing here, so a dropped page can never be
      # reported as a visual regression — the classifier decides which it was and
      # sets the exit code.
      #
      # Note the shell: this container has no bash on the Actions default path,
      # so steps run under `sh -e`. No bashisms here (`set -o pipefail` fails
      # outright as "Illegal option").
      - name: Run visual regression suite
        run: |
          VISUAL_GATE=1 npx vitest run --project storybook --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile=visual-report.json || true

      # #1778 AC 1: a dropped browser page must not read as a visual regression.
      # vitest prints both as a red `FAIL <file>`; the exact discriminator is
      # that a dropped suite has ZERO failed tests (its tests are skipped,
      # because the page died before they ran). This step is what makes the two
      # legible, and it owns the job's pass/fail verdict.
      - name: Classify the failure class
        run: node scripts/classify-visual-failure.mjs visual-report.json

      # On failure, the diff PNGs (and vitest's actual-screenshot attachments)
      # are the review surface — there is no hosted UI (ADR-026 tradeoff).
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tests/visual/__diffs__/
            **/.vitest-attachments/
            visual-report.json
          if-no-files-found: ignore
          retention-days: 14
