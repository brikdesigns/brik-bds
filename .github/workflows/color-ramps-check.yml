name: Color Ramp Check

# Ensures design-tokens/color-ramps.generated.json stays in sync with the Brand
# Kit anchors in design-tokens/brand-kits/*.json. Fails the build if a brand
# color was added, removed, or retuned without regenerating the committed ramps
# (`npm run gen:color-ramps`).
#
# Why this is a CI gate:
#   - The generated ramps are the input to the Figma sync (#1738), the alias
#     layer (#1739), and the consumer migration (#1740). A stale file silently
#     feeds a superseded brand value into all three.
#   - The generator pins the six named steps byte for byte. A hand-edit to the
#     generated file is the one way that guarantee can be broken without any
#     other check noticing — nothing in the token build pipeline reads this
#     file yet, so no build would fail.
#   - Cloud-agent commits bypass local hooks entirely.
#
# Source: scripts/generate-color-ramps.mjs (brik-bds#1737)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'design-tokens/brand-kits/**/*.json'
      - 'design-tokens/color-ramps.generated.json'
      - 'scripts/generate-color-ramps.mjs'
      - 'scripts/lib/oklch.mjs'
  push:
    branches:
      - main
    paths:
      - 'design-tokens/brand-kits/**/*.json'
      - 'design-tokens/color-ramps.generated.json'
      - 'scripts/generate-color-ramps.mjs'
      - 'scripts/lib/oklch.mjs'

concurrency:
  group: color-ramps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  color-ramps-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check generated color ramps are in sync
        run: npm run gen:color-ramps:check

      - name: Ramp invariants (anchors, monotonic lightness, hue, AA steps)
        run: npx vitest run scripts/__tests__/generate-color-ramps.test.mjs
